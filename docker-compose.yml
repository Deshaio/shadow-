version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: shadowforge_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    restart: unless-stopped

  bot:
    build: .
    container_name: shadowforge_bot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - SHODAN_KEY=${SHODAN_KEY}
      - VIRUSTOTAL_KEY=${VIRUSTOTAL_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_IDS=${ADMIN_IDS}
    volumes:
      - ./:/app
      - bot_data:/data
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis_data:
  bot_data: